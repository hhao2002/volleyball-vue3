server:
  port: 8080

spring:
  application:
    name: volleyball3
  datasource:
    url: jdbc:mysql://localhost:3306/volleyball3?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:volleyball}
    password: ${DB_PASSWORD:volleyball}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${JWT_SECRET:volleyball3-secret-key-please-change-in-production-2026}
    expire-hours: 168
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

logging:
  level:
    cn.edu.hnzj.volleyball.mapper: info
