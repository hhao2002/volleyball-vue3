# 无需 MySQL 的演示/测试配置：内存 H2，自动建表并写入种子数据
spring:
  datasource:
    url: jdbc:h2:mem:volleyball3;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
